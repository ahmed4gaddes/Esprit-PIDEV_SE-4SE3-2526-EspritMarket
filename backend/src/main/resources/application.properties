spring.application.name=esprit-market

# ===== Database =====
# Use 127.0.0.1 (not "localhost") on Windows to avoid IPv6 ::1 resolving to a hung/different listener.
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/esprit_market?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectTimeout=10000&socketTimeout=30000
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

