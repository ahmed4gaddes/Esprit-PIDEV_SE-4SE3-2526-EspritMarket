# ──────────────────────────────────────────────────────
# Frontend Service (NodePort)
# ClusterIP port: 80 → nginx inside container
# NodePort: 30080 → access from browser: http://<node-ip>:30080
# ──────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: esprit-market
    tier: frontend
spec:
  type: NodePort
  selector:
    app: esprit-market
    tier: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
      name: http
