# ──────────────────────────────────────────────────────
# MySQL PersistentVolumeClaim
# Ensures data survives pod restarts.
# ──────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  labels:
    app: esprit-market
    tier: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
