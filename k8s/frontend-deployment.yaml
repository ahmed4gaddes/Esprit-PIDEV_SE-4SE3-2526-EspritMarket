# ──────────────────────────────────────────────────────
# Frontend Deployment (Angular + Nginx)
# Image: esprit-market-frontend:latest  |  Port: 80
# Nginx proxies /api/ → backend:8081 (K8s DNS)
# ──────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: esprit-market
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: esprit-market
      tier: frontend
  template:
    metadata:
      labels:
        app: esprit-market
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: gaddes2001/esprit-market-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
