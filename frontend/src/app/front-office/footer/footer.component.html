<footer class="footer">
  <div class="footer-container">
    <div class="footer-grid">
      <!-- Brand Column -->
      <div class="footer-brand">
        <a href="/" class="footer-logo">
          <img src="assets/images/5mmmlogo.png" alt="ESPRIT Market" class="footer-logo-img">
          <span class="footer-logo-text">ESPRIT Market</span>
        </a>
        <p class="footer-description">
          The marketplace dedicated to ESPRIT students to transform their skills into opportunities.
        </p>
        <div class="social-links">
          <a *ngFor="let social of socialLinks" [href]="social.url" class="social-link">
            <i [class]="social.icon"></i>
          </a>
        </div>
      </div>

      <!-- Marketplace -->
      <div class="footer-column">
        <h4 class="footer-column-title">Marketplace</h4>
        <ul>
          <li *ngFor="let link of marketplaceLinks">
            <a href="#">{{ link }}</a>
          </li>
        </ul>
      </div>

      <!-- Sellers -->
      <div class="footer-column">
        <h4 class="footer-column-title">Sellers</h4>
        <ul>
          <li *ngFor="let link of sellerLinks">
            <a href="#">{{ link }}</a>
          </li>
        </ul>
      </div>

      <!-- Support -->
      <div class="footer-column">
        <h4 class="footer-column-title">Support</h4>
        <ul>
          <li *ngFor="let link of supportLinks">
            <a href="#">{{ link }}</a>
          </li>
        </ul>
      </div>
    </div>

    <!-- Bottom Bar -->
    <div class="footer-bottom">
      <p>&copy; 2026 ESPRIT Market. All rights reserved.</p>
      <p class="footer-made-with">
        Made with <i class="fas fa-heart" style="color: #C1272D;"></i> by ESPRIT students
      </p>
    </div>
  </div>
</footer>
