<nav class="navbar" [class.scrolled]="isScrolled">
  <div class="nav-container">
    <!-- Logo -->
    <a href="/" class="nav-logo">
      <div class="logo-wrapper">
        <img src="assets/images/5mmmlogo.png" alt="ESPRIT Market" class="nav-logo-img">
        <div class="adorable-tooltip">Coucou ! 👋</div>
      </div>
      <span class="nav-logo-text">ESPRIT Market</span>
    </a>

    <!-- Search Bar - Desktop -->
    <div class="search-bar">
      <i class="fas fa-search search-icon"></i>
      <input type="text" placeholder="Search for products, stores, services..." />
      <button class="search-btn">Search</button>
    </div>

    <!-- Links - Desktop -->
    <div class="nav-links">
      <a href="#" class="nav-link">Marketplace</a>
      <a href="#categories" class="nav-link">Categories</a>
      <a href="#stores" class="nav-link">Stores</a>
      <div class="nav-divider"></div>

      <!-- Not Logged In -->
      <ng-container *ngIf="(authService.isLoggedIn$ | async) === false">
        <a routerLink="/login" class="nav-link nav-login">
          <i class="fas fa-user"></i>
          Login
        </a>
        <button class="nav-cta" routerLink="/register">
          <i class="fas fa-rocket"></i>
          Create My Store
        </button>
      </ng-container>

      <!-- Logged In -->
      <ng-container *ngIf="authService.isLoggedIn$ | async">
        <div class="user-menu" style="display: flex; align-items: center; gap: 0.75rem;">
          <div
            style="display: flex; align-items: center; gap: 0.5rem; background: rgba(193,39,45,0.08); padding: 0.4rem 0.8rem; border-radius: 2rem;">
            <i class="fas fa-user-circle" style="font-size: 1.4rem; color: #C1272D;"></i>
            <div style="line-height: 1.2;">
              <div style="font-weight: 600; font-size: 0.85rem; color: #2d3436;">
                {{ authService.currentName$ | async }}
              </div>
              <div style="font-size: 0.7rem; color: #C1272D; text-transform: capitalize; font-weight: 500;">
                {{ (authService.currentRole$ | async)?.toLowerCase() }}
              </div>
            </div>
          </div>
          
          <!-- CUSTOMER CART BUTTON -->
          <button *ngIf="(authService.currentRole$ | async) === 'CUSTOMER'" routerLink="/customer/dashboard"
            style="display: flex; align-items: center; gap: 0.4rem; background: transparent; color: #2d3436; border: 1px solid #ddd; padding: 0.5rem 0.8rem; border-radius: 0.5rem; cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: all 0.2s ease;"
            onmouseover="this.style.background='#f8f9fa'" onmouseout="this.style.background='transparent'">
            <i class="fas fa-shopping-cart" style="color: #C1272D;"></i>
            Cart
            <span *ngIf="cartItemCount > 0" style="background: #C1272D; color: white; border-radius: 50%; padding: 0.1rem 0.4rem; font-size: 0.7rem; margin-left: 2px;">{{cartItemCount}}</span>
          </button>

          <button *ngIf="(authService.currentRole$ | async) === 'SELLER'" routerLink="/seller/dashboard"
            style="display: flex; align-items: center; gap: 0.4rem; background: #f39c12; color: white; border: none; padding: 0.5rem 1rem; border-radius: 0.5rem; cursor: pointer; font-size: 0.8rem; font-weight: 600; transition: all 0.2s ease;">
            <i class="fas fa-store"></i>
            Seller Panel
          </button>
          <button *ngIf="(authService.currentRole$ | async) === 'EXPERT'" routerLink="/service-backoffice"
            style="display: flex; align-items: center; gap: 0.4rem; background: #17a2b8; color: white; border: none; padding: 0.5rem 1rem; border-radius: 0.5rem; cursor: pointer; font-size: 0.8rem; font-weight: 600; transition: all 0.2s ease;">
            <i class="fas fa-chalkboard-teacher"></i>
            Expert Panel
          </button>
          <button *ngIf="(authService.currentRole$ | async) === 'COMPANY'" routerLink="/company/dashboard"
            style="display: flex; align-items: center; gap: 0.4rem; background: #6c757d; color: white; border: none; padding: 0.5rem 1rem; border-radius: 0.5rem; cursor: pointer; font-size: 0.8rem; font-weight: 600; transition: all 0.2s ease; margin-left: 0.5rem;">
            <i class="fas fa-briefcase"></i>
            Company Panel
          </button>
          <button (click)="authService.logout()"
            style="display: flex; align-items: center; gap: 0.4rem; background: #C1272D; color: white; border: none; padding: 0.5rem 1rem; border-radius: 0.5rem; cursor: pointer; font-size: 0.8rem; font-weight: 600; font-family: inherit; transition: all 0.2s ease;"
            onmouseover="this.style.background='#a11f24'" onmouseout="this.style.background='#C1272D'">
            <i class="fas fa-sign-out-alt"></i>
            Logout
          </button>
        </div>
      </ng-container>
    </div>

    <!-- Mobile Menu Toggle -->
    <button class="mobile-toggle" (click)="toggleMobileMenu()">
      <i [class]="isMobileMenuOpen ? 'fas fa-times' : 'fas fa-bars'" style="font-size: 1.5rem;"></i>
    </button>
  </div>

  <!-- Mobile Menu -->
  <div class="mobile-menu" [class.open]="isMobileMenuOpen">
    <div class="mobile-menu-content">
      <div class="mobile-search">
        <i class="fas fa-search search-icon"></i>
        <input type="text" placeholder="Search..." />
      </div>
      <a href="#" class="mobile-link">Marketplace</a>
      <a href="#categories" class="mobile-link">Categories</a>
      <a href="#stores" class="mobile-link">Stores</a>
      <hr class="mobile-divider">

      <!-- Not Logged In -->
      <ng-container *ngIf="(authService.isLoggedIn$ | async) === false">
        <a routerLink="/login" class="mobile-link">Login</a>
        <button class="mobile-cta" routerLink="/register">Create My Store</button>
      </ng-container>

      <!-- Logged In -->
      <ng-container *ngIf="authService.isLoggedIn$ | async">
        <div class="mobile-user-info" style="padding: 1rem; color: var(--text-primary); font-weight: 500;">
          Hello, {{ authService.currentName$ | async }}
        </div>
        <button (click)="authService.logout()" class="mobile-link"
          style="width: 100%; text-align: left; background: none; border: none; color: var(--primary-color);">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </ng-container>
    </div>
  </div>
</nav>
