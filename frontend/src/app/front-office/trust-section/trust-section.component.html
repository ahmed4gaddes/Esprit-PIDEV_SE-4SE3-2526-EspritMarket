<section class="trust-section">
  <div class="trust-container">
    <div class="trust-grid">
      <div *ngFor="let item of trustItems" class="trust-item">
        <div class="trust-icon">
          <i [class]="item.icon"></i>
        </div>
        <h3>{{ item.title }}</h3>
        <p>{{ item.description }}</p>
      </div>
    </div>
  </div>
</section>
