<section class="sponsored-section">
  <div class="sponsored-container">
    <div class="sponsored-header">
      <div>
        <div class="sponsored-title-row">
          <i class="fas fa-star" style="color: #eab308; font-size: 1.5rem;"></i>
          <h2>Sponsored Ads</h2>
        </div>
        <p>Animated featured campaigns from our sponsors</p>
      </div>
      <div class="sponsored-badge-pulse">
        <i class="fas fa-bullhorn"></i>
        Live Promotion
      </div>
    </div>

    <div class="ad-slider" [ngClass]="currentAd.themeClass">
      <button class="nav-btn nav-left" type="button" (click)="prevSlide()" aria-label="Previous ad">
        <i class="fas fa-chevron-left"></i>
      </button>

      <button class="nav-btn nav-right" type="button" (click)="nextSlide()" aria-label="Next ad">
        <i class="fas fa-chevron-right"></i>
      </button>

      <div class="ad-content">
        <div class="offer-chip">
          <i class="fas fa-fire"></i>
          Limited Offer
        </div>

        <h3 class="ad-title">{{ currentAd.title }}</h3>
        <p class="ad-subtitle">{{ currentAd.subtitle }}</p>
        <p class="ad-description">{{ currentAd.description }}</p>
        <div class="ad-price">{{ currentAd.price }}</div>

        <div class="ad-actions">
          <button class="discover-btn" type="button">
            {{ currentAd.cta }}
          </button>
        </div>
      </div>

      <div class="dots">
        <button
          type="button"
          class="dot"
          *ngFor="let ad of ads; let i = index"
          [class.active]="i === currentIndex"
          (click)="goToSlide(i)"
          [attr.aria-label]="'Go to ad ' + (i + 1)">
        </button>
      </div>
    </div>
  </div>
</section>
