<div class="dashboard-container" *ngIf="!loading">
    <!-- Welcome Section -->
    <div class="welcome-banner">
        <div class="welcome-content">
            <h1 class="welcome-title">Welcome to your Service Management Center</h1>
            <p class="welcome-message">Here's an overview of your active services and recent performance metrics.</p>
        </div>
        <div class="welcome-illustration">
            <i class="fas fa-chart-line"></i>
        </div>
    </div>

    <!-- Quick Stats Grid -->
    <div class="stats-grid">
        <div class="stat-card" routerLink="/service-backoffice/workshops">
            <div class="stat-icon workshop">
                <i class="fas fa-chalkboard-teacher"></i>
            </div>
            <div class="stat-info">
                <h3>{{ stats.workshops }}</h3>
                <p>Active Workshops</p>
            </div>
        </div>

        <div class="stat-card" routerLink="/service-backoffice/certificates">
            <div class="stat-icon certificate">
                <i class="fas fa-certificate"></i>
            </div>
            <div class="stat-info">
                <h3>{{ stats.certificates }}</h3>
                <p>Certificates Issued</p>
            </div>
        </div>

        <div class="stat-card" routerLink="/service-backoffice/courses">
            <div class="stat-icon course">
                <i class="fas fa-book"></i>
            </div>
            <div class="stat-info">
                <h3>{{ stats.courses }}</h3>
                <p>Standalone Courses</p>
            </div>
        </div>
    </div>

</div>

<div class="loading-state" *ngIf="loading">
    <div class="spinner"></div>
    <p>Loading your dashboard...</p>
</div>
