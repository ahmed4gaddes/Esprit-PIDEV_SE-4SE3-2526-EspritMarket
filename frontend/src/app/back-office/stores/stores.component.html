<div class="stores-page">
    <div class="page-header">
        <div>
            <h1>Stores</h1>
            <p>Manage and verify student entrepreneur stores.</p>
        </div>
        <button class="add-btn">
            <i class="fas fa-plus"></i>
            Verify New Store
        </button>
    </div>

    <div class="stores-grid">
        <div *ngFor="let store of stores" class="store-card">
            <div class="card-top">
                <div class="store-icon">
                    <i class="fas fa-store"></i>
                </div>
                <div class="card-actions">
                    <button class="card-action-btn"><i class="fas fa-edit"></i></button>
                    <button class="card-action-btn"><i class="fas fa-trash"></i></button>
                </div>
            </div>

            <div class="card-body">
                <div class="card-title-row">
                    <h3>{{ store.name }}</h3>
                    <span class="status-badge"
                        [ngClass]="store.status === 'Active' ? 'status-active' : 'status-pending'">
                        {{ store.status }}
                    </span>
                </div>
                <p class="card-owner">Owner: {{ store.owner }}</p>
                <div class="card-meta">
                    <span class="card-rating">
                        <i class="fas fa-star"></i> {{ store.rating }}
                    </span>
                    <span class="meta-dot"></span>
                    <span class="card-sales">{{ store.sales }} Sales</span>
                </div>
            </div>

            <div class="card-footer">
                <div class="card-location">
                    <i class="fas fa-map-marker-alt"></i>
                    {{ store.location }}
                </div>
                <span class="card-category">{{ store.category }}</span>
            </div>
        </div>
    </div>
</div>
