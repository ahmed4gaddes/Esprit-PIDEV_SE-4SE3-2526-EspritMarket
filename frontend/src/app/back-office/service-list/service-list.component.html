<div class="crud-container">
    <div class="header-actions">
        <h2>All Services Overview</h2>
        <!-- No add button, as abstract Service shouldn't be created directly, they are created via subtypes -->
        <div></div>
    </div>

    <div class="table-card">
        <div *ngIf="loading" class="loading-state">
            <div class="spinner"></div>
            <p>Loading all services...</p>
        </div>

        <table *ngIf="!loading && services.length > 0" class="data-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Type</th>
                    <th>Title</th>
                    <th>Price</th>
                    <th>Status</th>
                    <th class="actions-col">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let s of services">
                    <td>#{{ s.id }}</td>
                    <td><span class="badge badge-blue">{{ s.type }}</span></td>
                    <td class="primary-cell">{{ s.title }}</td>
                    <td>${{ s.price }}</td>
                    <td>
                        <span class="badge" [ngClass]="s.active ? 'badge-success' : 'badge-danger'">
                            {{ s.active ? 'Active' : 'Inactive' }}
                        </span>
                    </td>
                    <td class="actions-cell">
                        <button class="btn-icon btn-edit" (click)="openModal(s)"><i class="fas fa-edit"></i></button>
                        <button class="btn-icon btn-delete" (click)="deleteData(s.id)"><i
                                class="fas fa-trash-alt"></i></button>
                    </td>
                </tr>
            </tbody>
        </table>

        <div *ngIf="!loading && services.length === 0" class="empty-state">
            <i class="fas fa-cogs empty-icon"></i>
            <h3>No services found</h3>
            <p>Base overview of all subtypes (Workshops, Internships, etc).</p>
        </div>
    </div>
</div>

<div class="modal-backdrop" *ngIf="showModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Edit Base Service</h3>
            <button class="close-btn" (click)="closeModal()"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <form [formGroup]="formGroup" (ngSubmit)="saveData()">

                <div class="form-row">
                    <div class="form-group flex-2"><label>Title *</label><input type="text" formControlName="title"
                            class="form-control"></div>
                    <div class="form-group flex-1"><label>Price *</label><input type="number" formControlName="price"
                            class="form-control"></div>
                </div>

                <div class="form-group"><label>Description *</label><textarea formControlName="description"
                        class="form-control"></textarea></div>

                <div class="form-group checkbox-container">
                    <label class="checkbox-label"><input type="checkbox"
                            formControlName="active"><span>Active</span></label>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn-secondary" (click)="closeModal()">Cancel</button>
                    <button type="submit" class="btn-primary" [disabled]="formGroup.invalid"><i class="fas fa-save"></i>
                        Update Core Fields</button>
                </div>
            </form>
        </div>
    </div>
</div>
