<div class="users-page">
    <div class="page-header">
        <div>
            <h1>Users Management</h1>
            <p>Monitor and manage platform users.</p>
        </div>
        <div class="header-stats">
            <span class="stat-badge">{{ users.length }} Total</span>
        </div>
    </div>

    <div class="table-card">
        <div class="table-toolbar">
            <div class="search-wrapper">
                <i class="fas fa-search search-icon"></i>
                <input type="text" [(ngModel)]="searchTerm" (input)="filterUsers()"
                    placeholder="Search users by name or email..." class="search-input">
            </div>
        </div>

        <div *ngIf="loading" class="loading-state">
            <i class="fas fa-spinner fa-spin"></i> Loading users...
        </div>

        <div class="table-wrapper" *ngIf="!loading">
            <table>
                <thead>
                    <tr>
                        <th>User</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th class="th-right">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let user of filteredUsers" class="table-row">
                        <td>
                            <div class="user-cell">
                                <div class="user-avatar">{{ getInitials(user.name) }}</div>
                                <div>
                                    <div class="user-name">{{ user.name }}</div>
                                    <div class="user-email">
                                        <i class="fas fa-envelope"></i> {{ user.email }}
                                    </div>
                                </div>
                            </div>
                        </td>
                        <td>
                            <div class="role-cell">
                                <span class="role-badge" [ngClass]="'role-' + user.role.toLowerCase()">
                                    {{ user.role }}
                                </span>
                            </div>
                        </td>
                        <td>
                            <span class="status-badge" [ngClass]="user.isActive ? 'status-active' : 'status-inactive'">
                                {{ user.isActive ? 'Active' : 'Blocked' }}
                            </span>
                        </td>
                        <td class="td-right">
                            <div class="actions-cell">
                                <button class="action-btn" [class.btn-block]="user.isActive"
                                    [class.btn-unblock]="!user.isActive" (click)="toggleStatus(user)"
                                    [title]="user.isActive ? 'Block User' : 'Unblock User'">
                                    <i class="fas" [class.fa-lock]="user.isActive"
                                        [class.fa-unlock]="!user.isActive"></i>
                                </button>
                                <button class="action-btn btn-delete" (click)="deleteUser(user)" title="Delete User">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                    <tr *ngIf="filteredUsers.length === 0">
                        <td colspan="4" class="empty-state">
                            No users found matching "{{ searchTerm }}".
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
