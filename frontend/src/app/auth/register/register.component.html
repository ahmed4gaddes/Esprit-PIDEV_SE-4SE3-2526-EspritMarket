<div class="auth-page">
    <!-- Animated Background -->
    <div class="bg-shapes">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="auth-container">
        <!-- Left Side - Branding -->
        <div class="auth-branding">
            <div class="branding-content">
                <img src="/assets/images/esprit_market_logo_1770116815730.png" alt="ESPRIT Market" class="auth-logo">
                <h1>Join ESPRIT Market</h1>
                <p>Create your account and become part of the largest student marketplace in Tunisia.</p>
                <div class="branding-stats">
                    <div class="b-stat">
                        <span class="b-stat-value">1,200+</span>
                        <span class="b-stat-label">Students</span>
                    </div>
                    <div class="b-stat">
                        <span class="b-stat-value">500+</span>
                        <span class="b-stat-label">Products</span>
                    </div>
                    <div class="b-stat">
                        <span class="b-stat-value">120+</span>
                        <span class="b-stat-label">Stores</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Side - Form -->
        <div class="auth-form-side">
            <div class="auth-form-wrapper">
                <div class="form-header">
                    <h2>Create account</h2>
                    <p>Fill in your details to get started</p>
                </div>

                <form (ngSubmit)="onSubmit()" class="auth-form">
                    <!-- Role Selection -->
                    <div class="form-group">
                        <label>I am a</label>
                        <div class="role-grid">
                            <div *ngFor="let role of roles" class="role-option"
                                [class.selected]="selectedRole === role.value" (click)="selectRole(role.value)">
                                <i [class]="role.icon"></i>
                                <span class="role-label">{{ role.label }}</span>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user input-icon"></i>
                            <input type="text" id="name" [(ngModel)]="name" name="name" placeholder="Your full name"
                                required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="email" id="email" [(ngModel)]="email" name="email"
                                placeholder="your.name@esprit.tn" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="password">Password</label>
                            <div class="input-wrapper">
                                <i class="fas fa-lock input-icon"></i>
                                <input [type]="showPassword ? 'text' : 'password'" id="password" [(ngModel)]="password"
                                    name="password" placeholder="Min 8 characters" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="confirmPassword">Confirm</label>
                            <div class="input-wrapper">
                                <i class="fas fa-lock input-icon"></i>
                                <input [type]="showPassword ? 'text' : 'password'" id="confirmPassword"
                                    [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Repeat password"
                                    required>
                            </div>
                        </div>
                    </div>

                    <label class="terms-check">
                        <input type="checkbox" required>
                        <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
                    </label>

                    <button type="submit" class="submit-btn">
                        Create Account
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </form>

                <p class="auth-switch">
                    Already have an account?
                    <a routerLink="/login">Sign in</a>
                </p>
            </div>
        </div>
    </div>
</div>
