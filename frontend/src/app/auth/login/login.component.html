<div class="auth-page">
    <!-- Animated Background -->
    <div class="bg-shapes">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="auth-container">
        <!-- Left Side - Branding -->
        <div class="auth-branding">
            <div class="branding-content">
                <img src="/assets/images/esprit_market_logo_1770116815730.png" alt="ESPRIT Market" class="auth-logo">
                <h1>ESPRIT Market</h1>
                <p>The marketplace built by ESPRIT students, for ESPRIT students.</p>
                <div class="branding-features">
                    <div class="feature">
                        <i class="fas fa-store"></i>
                        <span>Create your own store</span>
                    </div>
                    <div class="feature">
                        <i class="fas fa-shopping-bag"></i>
                        <span>Buy & sell with classmates</span>
                    </div>
                    <div class="feature">
                        <i class="fas fa-shield-alt"></i>
                        <span>Secure student community</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Side - Form -->
        <div class="auth-form-side">
            <div class="auth-form-wrapper">
                <div class="form-header">
                    <h2>Welcome back</h2>
                    <p>Sign in to your ESPRIT Market account</p>
                </div>

                <div *ngIf="errorMessage" class="error-message"
                    style="background: #fee2e2; color: #dc2626; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; text-align: center;">
                    {{ errorMessage }}
                </div>

                <form (ngSubmit)="onSubmit()" class="auth-form">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="email" id="email" [(ngModel)]="email" name="email"
                                placeholder="your.name@esprit.tn" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock input-icon"></i>
                            <input [type]="showPassword ? 'text' : 'password'" id="password" [(ngModel)]="password"
                                name="password" placeholder="Enter your password" required>
                            <button type="button" class="toggle-password" (click)="togglePassword()">
                                <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox">
                            <span>Remember me</span>
                        </label>
                        <a routerLink="/forgot-password" class="forgot-link">Forgot password?</a>
                    </div>

                    <button type="submit" class="submit-btn">
                        Sign In
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </form>

                <div class="auth-divider">
                    <span>or</span>
                </div>

                <!-- Social Login Loading -->
                <div *ngIf="socialLoading" class="social-loading"
                    style="text-align: center; padding: 1rem; color: #636e72; font-size: 0.85rem;">
                    <i class="fas fa-spinner fa-spin" style="margin-right: 0.5rem;"></i>
                    Connecting...
                </div>

                <!-- Google Sign-In (rendered by SDK) -->
                <div *ngIf="!socialLoading" id="google-signin-btn" class="google-btn-container"></div>

                <p class="auth-switch">
                    Don't have an account?
                    <a routerLink="/register">Create account</a>
                </p>
            </div>
        </div>
    </div>
</div>
