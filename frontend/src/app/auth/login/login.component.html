<div class="auth-page">
    <!-- Interactive Cursor Glow -->
    <div class="cursor-glow" [style.transform]="'translate(' + mouseX + 'px, ' + mouseY + 'px)'"></div>

    <!-- Animated Background -->
    <div class="bg-shapes">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
    </div>

    <!-- Auth Container with 3D Tilt Effect -->
    <div class="auth-container" [style.transform]="tiltTransform">
        <!-- Left Side - Branding -->
        <div class="auth-branding">
            <div class="branding-content">
                <!-- Interactive Ensemble Mascot -->
                <div class="mascot-group-container">
                    <svg viewBox="0 0 250 150" xmlns="http://www.w3.org/2000/svg" class="mascot-group-svg" [class.covering-eyes]="isPasswordFocused">
                        <!-- BASE / PODIUM -->
                        <path d="M 20 140 Q 125 150 230 140" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4" stroke-linecap="round"/>

                        <!-- STUDENT 1 (Left - Boy) -->
                        <g class="student" transform="translate(60, 140)">
                            <!-- Body -->
                            <path d="M-30 0 C-30 -40, 30 -40, 30 0 Z" fill="#3498db"/>
                            <!-- Head -->
                            <circle cx="0" cy="-60" r="28" fill="#ffeaa7"/>
                            <!-- Hair -->
                            <path d="M-30 -60 C-30 -95, 30 -95, 30 -60 C25 -80, -25 -80, -30 -60 Z" fill="#2d3436"/>
                            <!-- Eyes -->
                            <g class="eyes">
                                <circle cx="-12" cy="-62" r="8" fill="white" stroke="#2d3436" stroke-width="1.5"/>
                                <circle cx="12" cy="-62" r="8" fill="white" stroke="#2d3436" stroke-width="1.5"/>
                                <circle cx="-12" cy="-62" r="3.5" fill="#2d3436" class="pupil" [style.transform]="getPupilTransform('boy')"/>
                                <circle cx="12" cy="-62" r="3.5" fill="#2d3436" class="pupil" [style.transform]="getPupilTransform('boy')"/>
                            </g>
                            <!-- Mouth -->
                            <path d="M-6 -45 Q0 -40 6 -45" fill="none" stroke="#2d3436" stroke-width="2" stroke-linecap="round"/>
                            <!-- Hands -->
                            <g class="hands">
                                <circle cx="-25" cy="-20" r="12" fill="#ffeaa7" class="hand hand-left-boy" />
                                <circle cx="25" cy="-20" r="12" fill="#ffeaa7" class="hand hand-right-boy" />
                            </g>
                        </g>

                        <!-- STUDENT 2 (Right - Girl with Grad Cap) -->
                        <g class="student" transform="translate(160, 140)">
                            <!-- Body -->
                            <path d="M-30 0 C-30 -40, 30 -40, 30 0 Z" fill="#C1272D"/>
                            <!-- Hair back -->
                            <path d="M-35 -60 Q-40 -10 -20 0" fill="#636e72" stroke="#636e72" stroke-width="8" stroke-linecap="round"/>
                            <path d="M35 -60 Q40 -10 20 0" fill="#636e72" stroke="#636e72" stroke-width="8" stroke-linecap="round"/>
                            <!-- Head -->
                            <circle cx="0" cy="-60" r="26" fill="#fab1a0"/>
                            <!-- Hair front -->
                            <path d="M-26 -60 Q0 -85 26 -60 Q0 -75 -26 -60 Z" fill="#636e72"/>
                            <!-- Graduation Cap -->
                            <g transform="translate(0, -85)">
                                <path d="M-30 0 L0 -15 L30 0 L0 15 Z" fill="#2d3436"/>
                                <rect x="-15" y="0" width="30" height="15" fill="#2d3436"/>
                                <line x1="20" y1="5" x2="20" y2="25" stroke="#f1c40f" stroke-width="2"/>
                                <circle cx="20" cy="27" r="3" fill="#f1c40f"/>
                            </g>
                            <!-- Eyes -->
                            <g class="eyes">
                                <circle cx="-11" cy="-58" r="7" fill="white" stroke="#2d3436" stroke-width="1.5"/>
                                <circle cx="11" cy="-58" r="7" fill="white" stroke="#2d3436" stroke-width="1.5"/>
                                <circle cx="-11" cy="-58" r="3" fill="#2d3436" class="pupil" [style.transform]="getPupilTransform('girl')"/>
                                <circle cx="11" cy="-58" r="3" fill="#2d3436" class="pupil" [style.transform]="getPupilTransform('girl')"/>
                            </g>
                            <!-- Mouth -->
                            <path d="M-5 -45 Q0 -40 5 -45" fill="none" stroke="#2d3436" stroke-width="2" stroke-linecap="round"/>
                            <!-- Hands -->
                            <g class="hands">
                                <circle cx="-25" cy="-20" r="11" fill="#fab1a0" class="hand hand-left-girl" />
                                <circle cx="25" cy="-20" r="11" fill="#fab1a0" class="hand hand-right-girl" />
                            </g>
                        </g>
                    </svg>
                </div>
                <h1>ESPRIT Market</h1>
                <p>The marketplace built by ESPRIT students, for ESPRIT students.</p>
                <div class="branding-features">
                    <div class="feature">
                        <i class="fas fa-store"></i>
                        <span>Create your own store</span>
                    </div>
                    <div class="feature">
                        <i class="fas fa-shopping-bag"></i>
                        <span>Buy & sell with classmates</span>
                    </div>
                    <div class="feature">
                        <i class="fas fa-shield-alt"></i>
                        <span>Secure student community</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Side - Form -->
        <div class="auth-form-side">
            <div class="auth-form-wrapper">
                <div class="form-header" style="text-align: center; margin-bottom: 2rem;">
                    <h2 style="font-size: 1.75rem; font-weight: 800; color: #2d3436; margin-bottom: 0.25rem;">Welcome back</h2>
                    <p style="color: #a0a5b1; font-size: 0.9rem;">Sign in to your account</p>
                </div>

                <div *ngIf="errorMessage" class="error-message"
                    style="background: #fee2e2; color: #dc2626; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; text-align: center;">
                    {{ errorMessage }}
                </div>

                <form (ngSubmit)="onSubmit()" class="auth-form">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="email" id="email" [(ngModel)]="email" name="email"
                                placeholder="your.name@esprit.tn" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock input-icon"></i>
                            <input [type]="showPassword ? 'text' : 'password'" id="password" [(ngModel)]="password"
                                name="password" placeholder="Enter your password" required 
                                (focus)="onPasswordFocus()" (blur)="onPasswordBlur()">
                            <button type="button" class="toggle-password" (click)="togglePassword()">
                                <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox">
                            <span>Remember me</span>
                        </label>
                        <a routerLink="/forgot-password" class="forgot-link">Forgot password?</a>
                    </div>

                    <button type="submit" class="submit-btn">
                        Sign In
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </form>

                <div class="auth-divider">
                    <span>or</span>
                </div>

                <!-- Social Login Loading -->
                <div *ngIf="socialLoading" class="social-loading"
                    style="text-align: center; padding: 1rem; color: #636e72; font-size: 0.85rem;">
                    <i class="fas fa-spinner fa-spin" style="margin-right: 0.5rem;"></i>
                    Connecting...
                </div>

                <!-- Google Sign-In (rendered by SDK) -->
                <div *ngIf="!socialLoading" id="google-signin-btn" class="google-btn-container"></div>

                <p class="auth-switch">
                    Don't have an account?
                    <a routerLink="/register">Create account</a>
                </p>
            </div>
        </div>
    </div>
</div>
