<!-- src/app/auth/complete-profile/complete-profile.component.html -->
<div class="auth-page">
    <!-- Animated Background -->
    <div class="bg-shapes">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="cursor-glow" [style.transform]="'translate(' + mouseX + 'px, ' + mouseY + 'px)'"></div>

    <div class="auth-container" [style.transform]="tiltTransform">
        <!-- Left Side - Branding -->
        <div class="auth-branding">
            <div class="branding-content">
                <!-- Interactive Ensemble Mascot -->
                <div class="mascot-group-container">
                    <svg viewBox="0 0 250 150" xmlns="http://www.w3.org/2000/svg" class="mascot-group-svg">
                        <path d="M 20 140 Q 125 150 230 140" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4" stroke-linecap="round"/>
                        <!-- STUDENT 1 (Left - Boy) -->
                        <g class="student" transform="translate(60, 140)">
                            <path d="M-30 0 C-30 -40, 30 -40, 30 0 Z" fill="#3498db"/>
                            <circle cx="0" cy="-60" r="28" fill="#ffeaa7"/>
                            <path d="M-30 -60 C-30 -95, 30 -95, 30 -60 C25 -80, -25 -80, -30 -60 Z" fill="#2d3436"/>
                            <g class="eyes">
                                <circle cx="-12" cy="-62" r="8" fill="white" stroke="#2d3436" stroke-width="1.5"/>
                                <circle cx="12" cy="-62" r="8" fill="white" stroke="#2d3436" stroke-width="1.5"/>
                                <circle cx="-12" cy="-62" r="3.5" fill="#2d3436" class="pupil" [style.transform]="getPupilTransform('boy')"/>
                                <circle cx="12" cy="-62" r="3.5" fill="#2d3436" class="pupil" [style.transform]="getPupilTransform('boy')"/>
                            </g>
                            <path d="M-6 -45 Q0 -40 6 -45" fill="none" stroke="#2d3436" stroke-width="2" stroke-linecap="round"/>
                            <g class="hands">
                                <circle cx="-25" cy="-20" r="12" fill="#ffeaa7" class="hand hand-left-boy" />
                                <circle cx="25" cy="-20" r="12" fill="#ffeaa7" class="hand hand-right-boy" />
                            </g>
                        </g>

                        <!-- STUDENT 2 (Right - Girl) -->
                        <g class="student" transform="translate(160, 140)">
                            <path d="M-30 0 C-30 -40, 30 -40, 30 0 Z" fill="#C1272D"/>
                            <path d="M-35 -60 Q-40 -10 -20 0" fill="#636e72" stroke="#636e72" stroke-width="8" stroke-linecap="round"/>
                            <path d="M35 -60 Q40 -10 20 0" fill="#636e72" stroke="#636e72" stroke-width="8" stroke-linecap="round"/>
                            <circle cx="0" cy="-60" r="26" fill="#fab1a0"/>
                            <path d="M-26 -60 Q0 -85 26 -60 Q0 -75 -26 -60 Z" fill="#636e72"/>
                            <g transform="translate(0, -85)">
                                <path d="M-30 0 L0 -15 L30 0 L0 15 Z" fill="#2d3436"/>
                                <rect x="-15" y="0" width="30" height="15" fill="#2d3436"/>
                                <line x1="20" y1="5" x2="20" y2="25" stroke="#f1c40f" stroke-width="2"/>
                                <circle cx="20" cy="27" r="3" fill="#f1c40f"/>
                            </g>
                            <g class="eyes">
                                <circle cx="-11" cy="-58" r="7" fill="white" stroke="#2d3436" stroke-width="1.5"/>
                                <circle cx="11" cy="-58" r="7" fill="white" stroke="#2d3436" stroke-width="1.5"/>
                                <circle cx="-11" cy="-58" r="3" fill="#2d3436" class="pupil" [style.transform]="getPupilTransform('girl')"/>
                                <circle cx="11" cy="-58" r="3" fill="#2d3436" class="pupil" [style.transform]="getPupilTransform('girl')"/>
                            </g>
                            <path d="M-5 -45 Q0 -40 5 -45" fill="none" stroke="#2d3436" stroke-width="2" stroke-linecap="round"/>
                            <g class="hands">
                                <circle cx="-25" cy="-20" r="11" fill="#fab1a0" class="hand hand-left-girl" />
                                <circle cx="25" cy="-20" r="11" fill="#fab1a0" class="hand hand-right-girl" />
                            </g>
                        </g>
                    </svg>
                </div>
                <h1>ESPRIT Market</h1>
                <p>Aidez-nous à créer une plateforme sécurisée pour tous les étudiants et diplômés d'ESPRIT.</p>
                <div class="branding-features">
                    <div class="feature">
                        <i class="fas fa-shield-alt"></i>
                        <span>Informations sécurisées</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Side - Form -->
        <div class="auth-form-side">
            <div class="auth-form-wrapper">
                <div class="form-header">
                    <h2>Presque terminé !</h2>
                    <p>Bonjour {{ userName }}, veuillez compléter ces informations pour finaliser votre inscription.</p>
                </div>

                <div *ngIf="errorMessage" class="error-message"
                    style="background: #fee2e2; color: #dc2626; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; text-align: center;">
                    {{ errorMessage }}
                </div>

                <form (ngSubmit)="onSubmit()" #profileForm="ngForm" class="auth-form">

                    <div class="form-group">
                        <label for="phoneNumber">Numéro de téléphone</label>
                        <div class="input-wrapper">
                            <i class="fas fa-phone input-icon"></i>
                            <input type="tel" id="phoneNumber" [(ngModel)]="phoneNumber" name="phoneNumber"
                                placeholder="Votre numéro" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="dateOfBirth">Date de naissance</label>
                        <div class="input-wrapper">
                            <i class="fas fa-calendar-alt input-icon"></i>
                            <input type="date" id="dateOfBirth" [(ngModel)]="dateOfBirth" name="dateOfBirth" required>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn" [disabled]="!profileForm.form.valid">
                        Continuer
                        <i class="fas fa-arrow-right"></i>
                    </button>

                </form>
            </div>
        </div>
    </div>
</div>
